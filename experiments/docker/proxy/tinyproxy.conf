# tinyproxy configuration: allow HTTPS (CONNECT to port 443) to allow-listed hosts only.
User nobody
Group nogroup
Port 8888
Listen 0.0.0.0
Timeout 900
MaxClients 64
LogLevel Info
# Only containers on private Docker networks may use the proxy.
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16
DisableViaHeader Yes
# Domain filtering: anything not matched by a line in the allowlist is refused.
Filter "/etc/tinyproxy/allowlist"
FilterType ere
FilterURLs Off
FilterDefaultDeny Yes
FilterCaseSensitive Off
ConnectPort 443
