[project]
name = "researchcode-experiments"
version = "0.1.0"
description = "Harness for the ResearchCode Phase 4 experiment: structured vs unstructured AI-assisted scientific coding."
readme = "README.md"
requires-python = ">=3.12"
# Runtime dependencies. NumPy and SciPy are also the only third-party packages available to
# submissions in the evaluation sandbox; Matplotlib draws the analysis figures; Ruff is the
# fixed static analyser for submissions. Add dependencies with `uv add`, never by hand.
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "ruff>=0.17.4",
    "scipy>=1.18.1",
]

[project.scripts]
rc-exp = "rc_experiments.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pytest>=9.2.0",
]
# Exactly what the evaluation sandbox image installs (exported to docker/sandbox/requirements.txt).
sandbox = [
    "hypothesis>=6.170.15",
    "numpy>=2.5.4",
    "pytest>=9.2.0",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rc_experiments"

# ---------------------------------------------------------------------------------------
# Ruff (the same rule set as the starter kit)
# ---------------------------------------------------------------------------------------
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "A", "S", "UP", "SIM", "C4", "PT", "N", "DTZ", "PTH", "NPY", "PGH", "T10", "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Tests use plain asserts, and call git with fixed arguments to list committable files.
"tests/**" = ["S101", "S603", "S607"]
# The harness starts only fixed executables (docker, git, and Python itself) with argument
# lists, never through a shell; S603/S607 would flag every such call.
"src/rc_experiments/**" = ["S603", "S607"]
# Hidden-case derivations use the conventional short name F for fractions.Fraction.
"src/rc_experiments/fixture_evaluator/*.py" = ["N817"]
# Fixtures are deliberately defective or minimal stand-ins for generated submissions.
"tests/fixtures/**" = ["S101", "N", "E501"]

# ---------------------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
  "docker: needs Docker and the sandbox image (skipped when unavailable unless RC_REQUIRE_DOCKER=1)",
]
