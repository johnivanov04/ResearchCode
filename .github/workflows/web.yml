name: Website

on:
  push:
    branches: [main]
    # scientific-starter/**, growth-analysis/**, and experiments/** are included because the
    # website's tests check that the starter-kit, example, and evaluation pages match the files,
    # commands, results, figures, and experiment configuration in those directories.
    paths: ["web/**", "scientific-starter/**", "growth-analysis/**", "experiments/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "scientific-starter/**", "growth-analysis/**", "experiments/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
