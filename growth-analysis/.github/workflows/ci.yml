# Continuous integration for growth-analysis (created from the ResearchCode scientific starter).
#
# GitHub runs this workflow when this directory is the root of your repository. (Inside the
# ResearchCode monorepo it is inactive; there, .github/workflows/growth-analysis.yml at the
# repository root runs the same steps.)
#
# On every push and pull request it installs exactly what uv.lock specifies, runs the same
# checks you run locally on each supported Python version, then runs the documented command
# on the synthetic sample data and checks its output.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      # Try many more random examples in property-based tests than local runs do.
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes only full version tags (there is no moving "v10" tag).
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # Pin uv so CI behaves the same on every run; update deliberately.
          version: "0.12.19"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install from the lock file
        run: uv sync --locked

      - name: Lint (including security rules)
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest

      - name: Build the package
        run: uv build

      - name: Install the built wheel in a clean environment and run its command
        # If you rename the package, update the import below.
        run: |
          uv run --isolated --no-project --with dist/*.whl python -c "import growth_analysis"
          uv run --isolated --no-project --with dist/*.whl growth-analyze --version

      - name: Analyse the synthetic sample plate
        run: uv run growth-analyze --input data/sample/synthetic_plate.csv --output results/ci

      - name: Check that every expected output file was produced
        run: |
          for file in results.json well_results.csv condition_summary.csv points.csv \
              run_metadata.json; do
            test -s "results/ci/$file" || { echo "missing or empty: $file"; exit 1; }
          done
          for figure in growth_curves exponential_fits growth_rate_comparison; do
            for format in png svg; do
              test -s "results/ci/figures/$figure.$format" \
                || { echo "missing or empty: $figure.$format"; exit 1; }
            done
          done
          uv run python -c "import json; json.load(open('results/ci/results.json')); json.load(open('results/ci/run_metadata.json'))"

      - name: Check that existing results are never overwritten
        run: |
          if uv run growth-analyze --input data/sample/synthetic_plate.csv --output results/ci; then
            echo "existing results were overwritten"
            exit 1
          fi

      - name: Check that a rerun gives identical results
        run: |
          uv run growth-analyze --input data/sample/synthetic_plate.csv --output results/rerun
          for file in results.json well_results.csv condition_summary.csv points.csv; do
            cmp "results/ci/$file" "results/rerun/$file"
          done
